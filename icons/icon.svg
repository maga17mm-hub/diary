<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#040506" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a7a" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d34" />
      <stop offset="100%" stop-color="#181a1f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#252932" stroke-width="2" />

  <!-- Book / Journal Body -->
  <g transform="translate(106, 96)">
    <!-- Back Cover Shadow & Edge -->
    <rect x="24" y="16" width="256" height="304" rx="24" fill="#0f1115" stroke="#1f232b" stroke-width="4" />
    
    <!-- Main Book Cover -->
    <rect x="12" y="8" width="256" height="304" rx="24" fill="url(#pageGrad)" stroke="#363b47" stroke-width="3" />
    
    <!-- Spine binding -->
    <rect x="12" y="8" width="40" height="304" rx="20" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.9" />
    
    <!-- Bookmark ribbon -->
    <path d="M190 8 L190 120 L206 102 L222 120 L222 8 Z" fill="#ff6363" />

    <!-- Notebook Lined Details -->
    <line x1="84" y1="80" x2="228" y2="80" stroke="#ff6363" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="84" y1="130" x2="228" y2="130" stroke="#4a505e" stroke-width="4" stroke-linecap="round" />
    <line x1="84" y1="180" x2="228" y2="180" stroke="#4a505e" stroke-width="4" stroke-linecap="round" />
    <line x1="84" y1="230" x2="170" y2="230" stroke="#4a505e" stroke-width="4" stroke-linecap="round" />

    <!-- Checkmark Badge on Note (Planning / Tasks) -->
    <circle cx="216" cy="230" r="22" fill="#ff5252" filter="url(#glow)" />
    <polyline points="208 230 214 236 226 223" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
